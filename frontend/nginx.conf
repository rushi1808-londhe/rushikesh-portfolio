# ---- Rate limiting (per client IP) -------------------------------------------------
# Login is limited hard here; the backend adds per-account lockout on top.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    server_tokens off;
    limit_conn perip 50;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Only the methods the app uses (blocks TRACE, CONNECT, etc.)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Never serve dotfiles or source maps
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.map$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- Backend ------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/(api|uploads|v3/api-docs|swagger-ui)(/|$) {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /swagger-ui.html {
        limit_req zone=api burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- Frontend -----------------------------------------------------------------
    location /assets/ {
        limit_req zone=static burst=200 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /admin {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        # Serve the SPA shell from this location (no internal redirect) so the headers above apply.
        rewrite ^ /index.html break;
    }

    location / {
        limit_req zone=static burst=100 nodelay;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
